[project]
name = "kumihimo"
description = "Braid a plan graph of plain-text files into one well-ordered prompt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thomas Zavislan" }]
keywords = ["planning", "graph", "prompt", "llm", "dag", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=0.24",
    # Plain uvicorn ships no WebSocket protocol; without this the live socket
    # works under TestClient and fails on the real server.
    "websockets>=13",
]

[project.urls]
Repository = "https://github.com/tzavislan/kumihimo"

[project.scripts]
kumihimo = "kumihimo.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "playwright>=1.62.0",
    # tools/demo_gif.py's frame assembly (quantize + animated save) — no
    # other dependency touches an image in this repo.
    "pillow>=10.4",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kumihimo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kumihimo"]

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist has no allowlist, so it walks the whole project
# root; it does honor the tracked .gitignore (node_modules/, dist/, the
# gitignored kumihimo/server/static all come out clean) but NOT machine-local
# ignore rules like .git/info/exclude. On a dev box using Claude Code's
# worktree-isolated agents, that leaves .claude/worktrees/ (other sessions'
# full nested checkouts) invisible to `git status` yet still swept into
# `uv build --sdist` — found via K35's build verification: an 8+ MB sdist
# that was 65% one machine's leftover agent worktrees. CI's fresh checkout
# never has this directory, so it never reached a published release, but the
# exclude keeps a locally-built sdist honest too.
exclude = [".claude/worktrees/"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Ships the gitignored, Vite-built kumihimo/server/static inside the wheel —
# but only when it exists, so Node stays optional. See hatch_build.py.
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# The Typer parameter idiom: Option/Argument in defaults is the API, not a bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
files = ["kumihimo", "tools"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
