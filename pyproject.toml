[project]
name = "kumihimo"
description = "Braid a plan graph of plain-text files into one well-ordered prompt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thomas Zavislan" }]
keywords = ["planning", "graph", "prompt", "llm", "dag", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Repository = "https://github.com/tzavislan/kumihimo"

[project.scripts]
kumihimo = "kumihimo.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kumihimo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kumihimo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# The Typer parameter idiom: Option/Argument in defaults is the API, not a bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
files = ["kumihimo", "tools"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
