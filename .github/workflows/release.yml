name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing — no tokens stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist (source only, by design)
        run: uv build --sdist
      - name: Build wheel (carries the built canvas)
        run: uv build --wheel
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
