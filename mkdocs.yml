site_name: Kumihimo
site_description: Braid a plan graph of plain-text files into one well-ordered prompt.
site_url: https://tzavislan.github.io/kumihimo/
repo_url: https://github.com/tzavislan/kumihimo
repo_name: tzavislan/kumihimo

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            heading_level: 3

nav:
  - Kumihimo: index.md
  - Concepts: concepts.md
  - How-to:
      - Custom kinds and templates: howto/custom-kinds.md
      - Claude over MCP: howto/claude-mcp.md
      - The editor: howto/editor.md
  - Reference:
      - CLI: reference/cli.md
      - File formats: reference/formats.md
      - MCP tools: reference/mcp-tools.md
      - Python API: reference/api.md
